name: Pages

# Build shipyard from a stock Go toolchain and publish the STATIC offline
# workstation to GitHub Pages. build-pages.sh produces shipyard.wasm +
# browser.wasm + shipwright's js/wasm toolchain + the whole standard library
# (stdsrc.json, seeded eagerly by pages.html), and stages it in _site/. The
# offline demo — boot the terminal, `go build` from the seeded std, `run` it in
# a window — runs fully in the visitor's browser. The networked features
# (external deps over /goproxy, browsing the live web over /fetch) need a server
# that static Pages hosting can't provide, so they are not wired up here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Build the wasm tools, harvest all-std, stage _site
        run: ./build-pages.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
