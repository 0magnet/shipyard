<!doctype html><meta charset="utf-8"><title>shipyard — a Go workstation in a tab</title>
<style>
  html,body{margin:0;height:100%;background:#0e0c14;color:#cdd2da;font:13px/1.5 ui-monospace,monospace;overflow:hidden}
  #desktop{position:absolute;inset:0}
  #boot{position:absolute;left:1em;bottom:.6em;color:#7a8290;z-index:0;white-space:pre}
</style>
<div id="desktop"></div>
<pre id="boot"></pre>
<script>
// Cross-origin isolation, without a server that can set headers. SharedArrayBuffer
// — and so fsbridge, and so compiles that do not freeze the tab — is only granted
// to a cross-origin-isolated page, and GitHub Pages cannot send COOP/COEP. coi-sw.js
// adds them to its own responses; this reloads once, after the worker takes control,
// because the FIRST navigation came from Pages without them. Guarded so a browser
// where it cannot work reloads once and then stops.
(function () {
  if (window.crossOriginIsolated || !('serviceWorker' in navigator)) return;
  var KEY = 'coi-sw-reloaded';
  navigator.serviceWorker.register('coi-sw.js', { scope: './' }).then(function () {
    if (navigator.serviceWorker.controller) return; // already tried and still not isolated
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (sessionStorage.getItem(KEY)) return;
      try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
      location.reload();
    });
  }).catch(function () {});
})();
</script>
<script src="jsfs.js"></script>
<script src="fsbridge.js"></script>
<script src="wasm_exec.js"></script>
<script src="proc.js"></script>
<script src="vnet.js"></script>
<script src="demos.js"></script>
<script>
window.addEventListener("error", function(e){ if(e.message && /already exited/.test(e.message)){ e.preventDefault(); } });
// Transport seam for the netscrape browser (globalThis.__netscrapeFetch). A
// loopback/vnet address is dialed over bottle's vnet and answered by an HTTP
// server running in THIS tab — client-side, no server, so it works on static
// Pages. Everything else falls back to serve's /fetch clearnet proxy.
window.__netscrapeFetch = function(url){
  try {
    var u = new URL(url.indexOf("://") < 0 ? "http://" + url : url);
    var h = u.hostname;
    if ((h === "127.0.0.1" || h === "localhost" || h === "::1" || h === "[::1]") && window.vnet) {
      var p = parseInt(u.port || "0", 10);
      if (p > 0) {
        var path = (u.pathname || "/") + (u.search || "");
        return window.vnet.httpFetch(p, "GET", path, null, {}).then(function(r){
          return new Response(r.body, { status: r.status || 200, headers: r.headers || {} });
        });
      }
    }
  } catch (e) {}
  return fetch("/fetch?url=" + encodeURIComponent(url));
};
(async function(){
  const boot = document.getElementById("boot");
  const log = (l) => { boot.textContent += l + "\n"; try{console.log(l);}catch(_){} };
  const fetchBytes = async (u) => new Uint8Array(await (await fetch(u)).arrayBuffer());

  // Restore the workstation from IndexedDB if we've been here before. The
  // toolchain is seeded once and persists across reloads; the standard library
  // is a lazy skeleton (below) — cheap to seed, its bytes fetched per-file on
  // first import — so a cold load pulls only the tools plus what a build
  // actually touches, and a reload pulls nothing.
  const cached = await jsfs.persist.enable("shipyard-fs", {
    // Keep the build cache and /tmp out of snapshots. serialize() deep-copies
    // every file it keeps, synchronously on the main thread, and markDirty
    // fires on every write — so with the cache included, each compile result
    // cmd/go writes schedules another full-tree copy and a build spends its
    // time freezing the page instead of building. jsfs documents this hook for
    // exactly this: runtime caches are rebuilt, not carried. The cost is a cold
    // build cache after a reload; the boot path recreates both directories.
    exclude: (p) => p === "/tmp" || p.startsWith("/tmp/") ||
      p === "/root/.cache" || p.startsWith("/root/.cache/"),
  });
  const have = (p) => { try { const b = jsfs.readFile(p); return !!(b && b.length); } catch (e) { return false; } };
  const firstVisit = !have("/bin/go");
  jsfs.mkdirp("/gopath"); jsfs.mkdirp("/work"); jsfs.mkdirp("/root/.cache/go-build"); jsfs.mkdirp("/tmp");
  if (!have("/bin/go")) {
  jsfs.mkdirp("/bin"); jsfs.mkdirp("/goroot/pkg/tool/js_wasm");
  jsfs.writeFile("/bin/go", await fetchBytes("go-proc.wasm"), 0o755);
  jsfs.writeFile("/goroot/pkg/tool/js_wasm/compile", await fetchBytes("compile-proc.wasm"), 0o755);
  jsfs.writeFile("/goroot/pkg/tool/js_wasm/link",    await fetchBytes("link-proc.wasm"),    0o755);
  jsfs.writeFile("/goroot/pkg/tool/js_wasm/asm",     await fetchBytes("asm-proc.wasm"),     0o755);
  jsfs.writeFile("/goroot/pkg/tool/js_wasm/vet",     await fetchBytes("vet-proc.wasm"),     0o755); // so `go test` can run vet
  jsfs.writeFile("/goroot/VERSION", "go1.27.0\n");
  jsfs.writeFile("/work/browser.wasm", await fetchBytes("browser.wasm"), 0o755); // a Go/wasm browser, prebuilt
  jsfs.writeFile("/work/server.wasm", await fetchBytes("server.wasm"), 0o755);   // a Go net/http server on vnet, prebuilt
  jsfs.writeFile("/work/go.mod", "module hello\n\ngo 1.27\n");
  jsfs.writeFile("/work/main.go", "package main\n\nimport \"fmt\"\n\nfunc main(){ fmt.Println(\"hello, built in a shell in a tab\") }\n");

  // The gallery's prebuilt demo programs, so a click launches instantly. Each
  // is a small self-contained Go program; its SOURCE is seeded at /work/demo
  // (below) so it is viewable and rebuildable in the desk.
  for (const w of ["fs.wasm","timeconc.wasm","procparent.wasm","procchild.wasm","netclient.wasm","gui.wasm"]) {
    jsfs.writeFile("/work/" + w, await fetchBytes(w), 0o755);
  }

  // The demo programs' SOURCE (one self-contained module at /work/demo), so
  // the desk can view and rebuild any of them, e.g.
  //   cd /work/demo && go build -o /work/server.wasm ./server && run server.wasm
  // demo.json is {inTabPath: sourceText}; the module carries its own copies of
  // bottle's vnet and proc drop-ins, so it builds offline from seeded std alone.
  try {
    const demo = await (await fetch("demo.json")).json();
    for (const p in demo) { jsfs.mkdirp(p.replace(/\/[^/]*$/, "")); jsfs.writeFile(p, demo[p]); }
    log("seeded the demo programs' source (" + Object.keys(demo).length + " files)");
  } catch (e) { log("demo source not seeded: " + e); }

  await jsfs.persist.flush(); // persist the toolchain now, so the next reload restores it
  log("seeded the toolchain" + (cached.restored ? "" : " (first visit)"));
  } else {
  log("restored the toolchain from cache");
  }

  // The toolchain lives in IndexedDB, so a returning visitor keeps whatever was
  // seeded on their first visit — a newly deployed build would never reach them.
  // A stamp written at build time settles it: when it differs from the one
  // stored beside the tools, the tools are replaced. Only the tools: /work is
  // the user's, and a toolchain update is no reason to overwrite their files.
  try {
    const want = (await (await fetch("toolchain.stamp", { cache: "no-cache" })).text()).trim();
    const got = have("/goroot/.stamp")
      ? new TextDecoder().decode(jsfs.readFile("/goroot/.stamp")).trim() : "";
    if (want && want !== got) {
      if (!firstVisit) {
        log("the toolchain changed since your last visit — replacing it");
        jsfs.mkdirp("/bin"); jsfs.mkdirp("/goroot/pkg/tool/js_wasm");
        jsfs.writeFile("/bin/go", await fetchBytes("go-proc.wasm"), 0o755);
        for (const t of ["compile", "link", "asm", "vet"]) {
          jsfs.writeFile("/goroot/pkg/tool/js_wasm/" + t, await fetchBytes(t + "-proc.wasm"), 0o755);
        }
      }
      jsfs.writeFile("/goroot/.stamp", want);
      await jsfs.persist.flush();
    }
  } catch (e) { log("toolchain stamp check skipped: " + e); }

  // The standard library: a lazy skeleton. Files fetched by an earlier build
  // (restored above) stay resident; the rest are (re)seeded lazy — their bytes
  // arrive from /std the first time a build imports them.
  const skel = await (await fetch("stdskel.json")).json();

  let lazy = 0; for (const p in skel) { if (!have(p)) { jsfs.writeLazy(p, skel[p], "/std" + p.slice(7)); lazy++; } }
  log("std library: " + lazy + " files lazy, " + (Object.keys(skel).length - lazy) + " resident");

  window.__shipyardGOPROXY = location.origin + "/goproxy";

  const ready = new Promise(res => { window.__shipyardReady = res; });
  const go = new Go();
  const {instance} = await WebAssembly.instantiate(await (await fetch("shipyard.wasm")).arrayBuffer(), go.importObject);
  go.run(instance);
  await ready;
  log("terminal open — type a command, or `cd /work && go build .`");

  // The "What the Go Playground can't do" gallery: a dock of one-click demos,
  // each captioned with the limitation it breaks (demos.js is the single source
  // of truth, shared with the static Pages build).
  window.shipyardGallery.render();

  // Optional headless self-test: run every gallery demo and log its marker.
  if (location.hash === "#selftest") {
    await window.shipyardGallery.selftest(log);
  }
})().catch(e => { document.getElementById("boot").textContent += "\nERROR "+e+"\n"+((e&&e.stack)||""); });
</script>
